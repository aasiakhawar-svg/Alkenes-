<title>Alkenes Storyboards · IGCSE Chemistry 4CH1</title>
<style>
:root{--bg:#f4f7f9;--card:#fff;--ink:#2b2f33;--mute:#6a737b;--line:#d9e0e6;--ans:#fff8e8;--ansline:#f29100;--chip:#e6f5f6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13181c;--card:#1d242a;--ink:#e8edf1;--mute:#9aa6b0;--line:#33404a;--ans:#2b2417;--chip:#17302f}}
:root[data-theme="dark"]{--bg:#13181c;--card:#1d242a;--ink:#e8edf1;--mute:#9aa6b0;--line:#33404a;--ans:#2b2417;--chip:#17302f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{background:#0E9AA7;color:#fff;padding:22px 18px 18px}
header h1{margin:0 0 4px;font-size:1.6rem}header p{margin:2px 0;opacity:.95;font-size:.95rem}
.wrap{max-width:1000px;margin:0 auto}
nav{display:flex;gap:8px;overflow-x:auto;padding:12px 14px;position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--line)}
nav button{flex:0 0 auto;border:2px solid var(--c);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:999px;font-weight:700;cursor:pointer;font-size:.95rem}
nav button.on{background:var(--c);color:#fff}
nav button .tick{margin-left:4px}
main{padding:16px 14px 40px}
.top h2{margin:6px 0 2px;font-size:1.4rem;color:var(--c)}
.spec{color:var(--mute);font-size:.92rem;margin:0 0 4px}
.chip{display:inline-block;background:var(--chip);color:var(--c);font-weight:700;font-size:.8rem;padding:2px 10px;border-radius:999px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px;margin:16px 0}
.frame{background:var(--card);border:2px solid var(--c);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.frame.blank{border-color:var(--ansline)}
.fh{background:var(--c);color:#fff;font-weight:700;padding:7px 12px;font-size:.9rem}
.blank .fh{background:var(--ansline)}
.fb{padding:12px;display:flex;flex-direction:column;gap:8px;flex:1}
.scene{font-style:italic;color:var(--mute);font-size:.9rem;margin:0}
.cap{margin:0}
.blank .fb{background:var(--ans)}
textarea{width:100%;min-height:84px;border:1px dashed var(--ansline);border-radius:8px;padding:8px;font:inherit;background:var(--card);color:var(--ink);resize:vertical}
.rev{align-self:flex-start;border:0;background:var(--ansline);color:#fff;font-weight:700;padding:7px 14px;border-radius:8px;cursor:pointer}
.answer{display:none;border-left:4px solid #5FA33B;padding:6px 10px;background:var(--card);border-radius:6px;font-size:.95rem}
.answer.show{display:block}
figure{margin:0;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
figure img{max-width:100%;height:auto}figcaption{color:#555;font-size:.85rem;margin-top:4px}
.challenge{border-left:6px solid var(--c);background:var(--card);padding:12px 14px;border-radius:8px;margin:16px 0}
.row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
.btn{border:2px solid var(--c);background:var(--card);color:var(--ink);padding:9px 16px;border-radius:10px;font-weight:700;cursor:pointer}
.btn.fill{background:var(--c);color:#fff}
footer{text-align:center;color:var(--mute);font-size:.85rem;padding:16px}
</style></head><body>
